name: Pause Supabase
on:
  schedule:
    - cron: '30 17 21 9 *'   # Sept 21, 17:30 UTC = 8:30 PM Kenya
  workflow_dispatch:          # lets you also run it by hand from your phone
jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_TOKEN }}" \
            https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_REF }}/pause